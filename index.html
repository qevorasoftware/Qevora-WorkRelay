<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Qevora WorkRelay — One workspace. Clear requests. Faster approvals. Client collaboration and project delivery for web design agencies." />
    <meta name="color-scheme" content="light dark" />
    <title>Qevora WorkRelay</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('workrelay-ui');
          var s = raw ? JSON.parse(raw) : {};
          var mode = (s && s.state && s.state.mode) || 'light';
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.density = (s && s.state && s.state.density) || 'comfortable';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
